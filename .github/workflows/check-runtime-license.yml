name: Check Runtime License Headers
run-name: "Check Runtime License Headers ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"

on:
  pull_request:
    branches:
      - master

  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  check-runtime-license:
    if: false   # racecar: scan/report job, not a build
    name: Runtime license headers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check runtime mark present in SimulationRuntime source files
        run: |
          python3 .CI/scripts/check_runtime_license.py \
            --summary                                  \
            OMCompiler                                 \
            OMEdit                                     \
            OMNotebook                                 \
            OMOptim                                    \
            OMParser                                   \
            OMPlot                                     \
            OMSens_Qt                                  \
            OMShell                                    \
            OMSimulator
